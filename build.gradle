import org.apache.tools.ant.filters.ReplaceTokens

plugins {
    alias(libs.plugins.fabric.loom)
    alias(libs.plugins.maven.publish)
    alias(libs.plugins.gradle.build.utils)
    alias(libs.plugins.java)
    alias(libs.plugins.lombok)
}

Properties props = buildUtils.loadProperties('publish.properties')  // will be empty, if the file is missing

group = project.maven_group
version = "${project.mod_version}+${libs.versions.minecraft.get()}"

def modId = project.mod_id
def javaVersion = libs.versions.java.get().toInteger()

base {
    archivesName = modId
}

repositories {
    maven {
        url "https://repo.lclpnet.work/repository/internal"
    }

    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "modid" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        remove client
    }
}

dependencies {
    minecraft(libs.minecraft)
    implementation(libs.fabric.loader)

    implementation(libs.fabric.api)
    implementation(libs.kibu)
    implementation(libs.gaco)

    def includeImpl = { lib ->
        implementation(lib)
        include(lib)
    }

    includeImpl(libs.night.config.core)
    includeImpl(libs.night.config.toml)
    includeImpl(libs.json)

    // discord bot
    implementation(libs.jda) {
        exclude module: 'opus-java' // required for encoding audio into opus, not needed if audio is already provided in opus encoding
        exclude module: 'tink' // required for encrypting and decrypting audio
    }
    include(libs.jda) {
        exclude module: 'opus-java' // required for encoding audio into opus, not needed if audio is already provided in opus encoding
        exclude module: 'tink' // required for encrypting and decrypting audio
    }
    includeImpl(libs.okhttp.jvm)
    includeImpl(libs.nv.websocket.client)
    includeImpl(libs.trove4j.core)
    includeImpl(libs.okio)
    includeImpl(libs.commons.collections4)
    includeImpl(libs.jackson.core)
    includeImpl(libs.jackson.databind)
    includeImpl(libs.jackson.annotations)

    testImplementation(libs.fabric.loader.junit)
}

test {
    useJUnitPlatform()
}

processResources {
    def tokens = [
            "version": project.version.toString(),
            "loader_version": libs.versions.fabric.loader.get(),
            "minecraft_compat": project.minecraft_compat,
            "java_version": javaVersion.toString()
    ]

    inputs.properties(tokens)

    filesMatching("fabric.mod.json") {
        expand(tokens)
    }

    filesMatching("*.mixins.json") {
        filter(ReplaceTokens, beginToken: '${', endToken: '}', tokens: tokens)
    }
}

tasks.withType(JavaCompile).configureEach {
	it.options.release.set(javaVersion)
}

java {
    withSourcesJar()

    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }

    sourceCompatibility = JavaVersion.toVersion(javaVersion)
    targetCompatibility = JavaVersion.toVersion(javaVersion)
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = project.base.archivesName.get()

            from components.java

            pom {
                name = 'player-switch'
                description = 'A Fabric mod for Minecraft: Java Edition that switches the active player after set time intervals. Only one player can play the game at a time '
            }
        }
    }

    // automatically use DEPLOY_URL, DEPLOY_USER and DEPLOY_PASSWORD environment variables
    // or mavenHost, mavenUser and mavenPassword from props
    buildUtils.setupPublishRepository(repositories, props)
}