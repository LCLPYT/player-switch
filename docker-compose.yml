services:
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: player-switch
    stop_grace_period: 60s
    stdin_open: true
    tty: true
    ports:
      - "25565:25565"
    environment:
      EULA: "${EULA:-false}"  # needs to be specified by the user
      MAX_MEMORY: 2G
    volumes:
      - data:/data

volumes:
  data:

# uncomment for use with podman (remove upper volumes def and block in server)
#    userns_mode: keep-id
#    volumes:
#      - ./data:/data
